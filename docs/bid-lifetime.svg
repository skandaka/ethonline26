<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>A CCA bid's lifetime, and where the two exit hints sit</title>
  <desc>The clearing price never decreases between checkpoints, so a bid's lifetime splits into three contiguous regions: fully filled, partially filled, and outbid. The two hints required by exitPartiallyFilledBid are the boundaries between them.</desc>

  <rect x="0" y="0" width="780" height="360" rx="10" fill="#ffffff" stroke="#d8dee6"/>

  <text x="32" y="38" font-size="16" font-weight="700" fill="#12161c">A bid's lifetime is three ordered regions</text>
  <text x="32" y="58" font-size="12.5" fill="#5b6675">The clearing price never decreases between checkpoints — so the two hints are just the boundaries.</text>

  <!-- region bands -->
  <rect x="92" y="84" width="258" height="176" fill="#2f7d57" opacity="0.10"/>
  <rect x="350" y="84" width="160" height="176" fill="#b6862c" opacity="0.13"/>
  <rect x="510" y="84" width="180" height="176" fill="#b4453c" opacity="0.11"/>

  <!-- region labels -->
  <text x="221" y="104" font-size="12.5" font-weight="600" fill="#245f43" text-anchor="middle">fully filled</text>
  <text x="221" y="120" font-size="11" fill="#3d7a5d" text-anchor="middle">clearing &lt; maxPrice</text>

  <text x="430" y="104" font-size="12.5" font-weight="600" fill="#7d5c14" text-anchor="middle">partially filled</text>
  <text x="430" y="120" font-size="11" fill="#94701f" text-anchor="middle">clearing = maxPrice</text>

  <text x="600" y="104" font-size="12.5" font-weight="600" fill="#8f322b" text-anchor="middle">outbid</text>
  <text x="600" y="120" font-size="11" fill="#a4443b" text-anchor="middle">clearing &gt; maxPrice</text>

  <!-- axes -->
  <line x1="92" y1="260" x2="700" y2="260" stroke="#98a2b0" stroke-width="1.2"/>
  <line x1="92" y1="84" x2="92" y2="260" stroke="#98a2b0" stroke-width="1.2"/>
  <text x="70" y="150" font-size="11.5" fill="#5b6675" text-anchor="middle" transform="rotate(-90 70 150)">clearing price</text>
  <text x="700" y="278" font-size="11" fill="#5b6675" text-anchor="end">checkpoints, in block order →</text>

  <!-- the bid's max price -->
  <line x1="92" y1="160" x2="700" y2="160" stroke="#3c4650" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="706" y="156" font-size="11.5" font-weight="600" fill="#3c4650">bid.maxPrice</text>

  <!-- clearing price step line (monotonically non-decreasing) -->
  <path d="M 110 210 H 350 V 160 H 510 V 110 H 690" fill="none" stroke="#1f5fa8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- checkpoint dots -->
  <g fill="#1f5fa8">
    <circle cx="110" cy="210" r="4.2"/>
    <circle cx="190" cy="210" r="4.2"/>
    <circle cx="270" cy="210" r="4.2"/>
    <circle cx="350" cy="160" r="4.2"/>
    <circle cx="430" cy="160" r="4.2"/>
    <circle cx="510" cy="110" r="4.2"/>
    <circle cx="590" cy="110" r="4.2"/>
    <circle cx="670" cy="110" r="4.2"/>
  </g>

  <!-- hint 1 marker -->
  <line x1="270" y1="210" x2="270" y2="286" stroke="#245f43" stroke-width="1.4"/>
  <circle cx="270" cy="210" r="6.4" fill="none" stroke="#245f43" stroke-width="2.2"/>
  <text x="270" y="302" font-size="11.5" font-weight="700" fill="#245f43" text-anchor="middle">lastFullyFilledCheckpointBlock</text>
  <text x="270" y="316" font-size="10.5" fill="#3d7a5d" text-anchor="middle">last checkpoint strictly below the bid</text>

  <!-- hint 2 marker -->
  <line x1="510" y1="110" x2="510" y2="286" stroke="#8f322b" stroke-width="1.4"/>
  <circle cx="510" cy="110" r="6.4" fill="none" stroke="#8f322b" stroke-width="2.2"/>
  <text x="548" y="302" font-size="11.5" font-weight="700" fill="#8f322b" text-anchor="middle">outbidBlock</text>
  <text x="548" y="316" font-size="10.5" fill="#a4443b" text-anchor="middle">first checkpoint strictly above the bid</text>
</svg>
